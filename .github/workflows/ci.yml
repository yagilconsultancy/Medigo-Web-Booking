name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Build Project
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_API_URL: ${{ secrets.NEXT_PUBLIC_BASE_API_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
          NEXT_PUBLIC_SOCKET_PATH: ${{ secrets.NEXT_PUBLIC_SOCKET_PATH }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TAWK_CHAT_ID: ${{ secrets.NEXT_PUBLIC_TAWK_CHAT_ID }}
          NEXT_PUBLIC_CLOUD_FRONT_BASE_URL: ${{ secrets.NEXT_PUBLIC_CLOUD_FRONT_BASE_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            export PATH="/usr/local/bin:/usr/bin:$HOME/.nvm/versions/node/$(nvm current)/bin:$PATH"

            cd /home/ubuntu/medigo-booking

            # Pull latest code
            git pull origin main

            # Install dependencies
            npm ci --production=false

            # Create .env file from secrets
            cat > .env <<'ENVEOF'
            NEXT_PUBLIC_BASE_API_URL=${{ secrets.NEXT_PUBLIC_BASE_API_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
            NEXT_PUBLIC_SOCKET_PATH=${{ secrets.NEXT_PUBLIC_SOCKET_PATH }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_TAWK_CHAT_ID=${{ secrets.NEXT_PUBLIC_TAWK_CHAT_ID }}
            NEXT_PUBLIC_CLOUD_FRONT_BASE_URL=${{ secrets.NEXT_PUBLIC_CLOUD_FRONT_BASE_URL }}
            NODE_ENV=production
            ENVEOF

            # Build the project
            npm run build

            # Restart with PM2
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production

            # Save PM2 process list
            pm2 save
